<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="通过 Keil UVSC 实时查看 STM32 数组波形"
    />
    <title>Keil Array Viewer</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <p class="eyebrow">STM32 / UVSC MONITOR</p>
          <h1>Keil Array Viewer</h1>
        </div>

        <div class="top-actions">
          <button id="source-config-button" class="config-button" type="button">
            <span aria-hidden="true">⚙</span>
            数据源
          </button>

          <div class="connection">
            <span id="connection-dot" class="status-dot"></span>
            <div>
              <span id="connection-label">正在连接</span>
              <small id="connection-detail">UVSOCK :35876</small>
            </div>
          </div>

          <div class="refresh-controls">
            <label class="auto-control" for="auto-refresh">
              <span>自动刷新</span>
              <span class="switch">
                <input id="auto-refresh" type="checkbox" checked />
                <span class="slider"></span>
              </span>
            </label>

            <label class="interval-control" for="interval-ms">
              <input
                id="interval-ms"
                type="number"
                min="50"
                max="60000"
                step="50"
                value="500"
                aria-label="刷新间隔"
              />
              <span>ms</span>
            </label>

            <button id="manual-refresh" class="refresh-button" type="button">
              <span class="refresh-icon" aria-hidden="true">↻</span>
              立即刷新
            </button>
          </div>
        </div>
      </header>

      <main>
        <section class="chart-panel">
          <div class="chart-heading">
            <div>
              <div class="title-line">
                <h2 id="array-name-title">myLOGGER0Arr</h2>
                <span id="trigger-badge" class="trigger-badge">等待数据</span>
              </div>
              <p class="subtitle">
                <span id="array-meta">float32 · 400 points</span>
                <span class="separator">/</span>
                <span id="capture-time">—</span>
              </p>
            </div>

            <div class="legend" aria-label="波形图例">
              <span class="legend-line"></span>
              <span id="legend-label">myLOGGER0Arr</span>
            </div>
          </div>

          <div id="waveform" class="waveform"></div>

          <footer class="chart-footer">
            <div class="target-meta">
              <span>
                Target
                <strong id="target-state">—</strong>
              </span>
              <span>
                Curves
                <strong id="memory-address">1</strong>
              </span>
              <span>
                Port
                <strong id="uvsock-port">35876</strong>
              </span>
            </div>

            <div class="capture-stats">
              <span id="sequence">Snapshot —</span>
              <span id="read-duration">Read — ms</span>
            </div>
          </footer>

          <p id="control-message" class="control-message"></p>
        </section>
      </main>

      <dialog id="source-dialog" class="source-dialog">
        <form id="source-form">
          <header class="dialog-heading">
            <div>
              <p class="eyebrow">DATA SOURCE</p>
              <h3>读取配置</h3>
            </div>
            <button
              id="source-dialog-close"
              class="dialog-close"
              type="button"
              aria-label="关闭"
            >
              ×
            </button>
          </header>

          <div class="source-fields">
            <label class="keil-path-field">
              Keil 安装目录或 UVSC DLL
              <input
                id="keil-path"
                type="text"
                required
                maxlength="4096"
                placeholder="E:\Keil\Keil_v5"
                autocomplete="off"
              />
            </label>

            <label class="map-file-field">
              MAP 文件路径
              <input
                id="map-file"
                type="text"
                required
                maxlength="4096"
                placeholder="D:\path\to\application.map"
                autocomplete="off"
              />
            </label>

            <p id="map-file-note" class="map-file-note">
              配置自动保存 · 留空的数组地址将从 MAP 文件解析
            </p>

            <div class="source-list-heading">
              <div>
                <strong>曲线列表</strong>
                <small>同一刷新周期内依次读取并绘制</small>
              </div>
              <button id="add-source" class="add-source-button" type="button">
                ＋ 添加曲线
              </button>
            </div>

            <div id="source-list" class="source-list"></div>

            <p id="source-error" class="source-error"></p>
          </div>

          <footer class="dialog-actions">
            <button
              id="source-cancel"
              class="dialog-button secondary"
              type="button"
            >
              取消
            </button>
            <button
              id="source-save"
              class="dialog-button primary"
              type="submit"
            >
              保存并读取
            </button>
          </footer>
        </form>
      </dialog>

      <template id="source-row-template">
        <article class="source-row">
          <header>
            <div class="source-number">曲线 1</div>
            <button
              class="remove-source"
              type="button"
              aria-label="删除曲线"
            >
              删除
            </button>
          </header>

          <div class="source-row-fields">
            <label class="source-name-field">
              数组名称
              <input
                data-field="name"
                type="text"
                required
                maxlength="256"
                autocomplete="off"
              />
            </label>

            <label>
              元素数量
              <input data-field="count" type="number" min="1" required />
            </label>

            <label>
              数据类型
              <select data-field="dtype">
                <option value="float32">float32</option>
                <option value="float64">float64</option>
                <option value="int8">int8</option>
                <option value="uint8">uint8</option>
                <option value="int16">int16</option>
                <option value="uint16">uint16</option>
                <option value="int32">int32</option>
                <option value="uint32">uint32</option>
              </select>
            </label>

            <label class="source-address-field">
              起始地址（可选）
              <input
                data-field="address"
                type="text"
                placeholder="留空按 MAP 解析"
                autocomplete="off"
              />
            </label>
          </div>
        </article>
      </template>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
