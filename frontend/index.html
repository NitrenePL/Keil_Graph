<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="通过 Keil UVSC 实时查看 STM32 数组波形"
    />
    <title>Keil Array Viewer</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <p class="eyebrow">STM32 / UVSC MONITOR</p>
          <h1>Keil Array Viewer</h1>
        </div>

        <div class="top-actions">
          <div class="connection">
            <span id="connection-dot" class="status-dot"></span>
            <div>
              <span id="connection-label">正在连接</span>
              <small id="connection-detail">UVSOCK :35876</small>
            </div>
          </div>

          <div class="refresh-controls">
            <label class="auto-control" for="auto-refresh">
              <span>自动刷新</span>
              <span class="switch">
                <input id="auto-refresh" type="checkbox" checked />
                <span class="slider"></span>
              </span>
            </label>

            <label class="interval-control" for="interval-ms">
              <input
                id="interval-ms"
                type="number"
                min="50"
                max="60000"
                step="50"
                value="500"
                aria-label="刷新间隔"
              />
              <span>ms</span>
            </label>

            <button id="manual-refresh" class="refresh-button" type="button">
              <span class="refresh-icon" aria-hidden="true">↻</span>
              立即刷新
            </button>
          </div>
        </div>
      </header>

      <main>
        <section class="chart-panel">
          <div class="chart-heading">
            <div>
              <div class="title-line">
                <h2>myLOGGER0Arr</h2>
                <span id="trigger-badge" class="trigger-badge">等待数据</span>
              </div>
              <p class="subtitle">
                <span id="array-meta">float32 · 400 points</span>
                <span class="separator">/</span>
                <span id="capture-time">—</span>
              </p>
            </div>

            <div class="legend" aria-label="波形图例">
              <span class="legend-line"></span>
              <span>myLOGGER0Arr</span>
            </div>
          </div>

          <div id="waveform" class="waveform"></div>

          <footer class="chart-footer">
            <div class="target-meta">
              <span>
                Target
                <strong id="target-state">—</strong>
              </span>
              <span>
                Address
                <strong id="memory-address">0x200041E4</strong>
              </span>
              <span>
                Port
                <strong id="uvsock-port">35876</strong>
              </span>
            </div>

            <div class="capture-stats">
              <span id="sequence">Snapshot —</span>
              <span id="read-duration">Read — ms</span>
            </div>
          </footer>

          <p id="control-message" class="control-message"></p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
